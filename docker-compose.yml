version: "3.9"

# Local development stack
# Run: docker compose up
# The app works without Qdrant/Redis (in-memory fallback active)
# Set GROQ_API_KEY in .env for real LLM responses

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AUDIT_PATH=/tmp/audit.jsonl
    volumes:
      - ./app:/app/app:ro          # hot-reload app code
      - ./static:/app/static:ro
    restart: unless-stopped

  # Optional: uncomment to enable vector search
  # qdrant:
  #   image: qdrant/qdrant:v1.11.3
  #   ports: ["6333:6333"]
