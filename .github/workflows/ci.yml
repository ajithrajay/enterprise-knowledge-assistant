name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enterprise-ka:ci .

      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 \
            -e JWT_SECRET=ci-test-secret-32-chars-minimum \
            --name ka-ci enterprise-ka:ci
          sleep 15
          curl -f http://localhost:8000/health
          docker stop ka-ci
